<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46a358"/>
      <stop offset="100%" stop-color="#2d773a"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eaeaea"/>
      <stop offset="100%" stop-color="#bcbcbc"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background for Android / PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Fairway Ring -->
  <circle cx="360" cy="270" r="64" fill="#256330" opacity="0.4"/>

  <!-- Golf Cup -->
  <ellipse cx="360" cy="285" rx="36" ry="16" fill="#18181b"/>
  <ellipse cx="360" cy="283" rx="34" ry="13" fill="#09090b"/>

  <!-- Flagpole -->
  <line x1="360" y1="120" x2="360" y2="280" stroke="#faf6ee" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Flag (Golf Red) -->
  <path d="M 364 125 L 436 155 L 364 185 Z" fill="#db5641" stroke="#b83f2d" stroke-width="2"/>

  <!-- Golf Ball with Shadow -->
  <ellipse cx="180" cy="340" rx="60" ry="24" fill="#000000" opacity="0.3" filter="url(#shadow)"/>
  <circle cx="180" cy="310" r="64" fill="url(#ballGrad)" filter="url(#shadow)"/>

  <!-- Golf Ball Dimples -->
  <g fill="#000000" opacity="0.08">
    <circle cx="160" cy="285" r="4"/>
    <circle cx="185" cy="280" r="4.5"/>
    <circle cx="210" cy="290" r="4"/>
    <circle cx="150" cy="310" r="4.5"/>
    <circle cx="175" cy="308" r="5"/>
    <circle cx="200" cy="312" r="4.5"/>
    <circle cx="162" cy="335" r="4"/>
    <circle cx="188" cy="334" r="4.5"/>
  </g>

  <!-- Android Green Antenna Accent -->
  <path d="M 230 180 L 250 145" stroke="#a4c639" stroke-width="6" stroke-linecap="round"/>
  <path d="M 270 180 L 290 145" stroke="#a4c639" stroke-width="6" stroke-linecap="round"/>
  <path d="M 224 195 A 36 36 0 0 1 296 195 Z" fill="#a4c639"/>
  <circle cx="244" cy="186" r="3.5" fill="#ffffff"/>
  <circle cx="276" cy="186" r="3.5" fill="#ffffff"/>
</svg>
